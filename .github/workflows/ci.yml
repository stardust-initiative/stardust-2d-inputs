name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default token.
permissions:
  contents: read

jobs:
  lint:
    name: lint + format + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the secret scan covers it

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit (ruff lint + format, gitleaks, hygiene)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  test:
    name: tests (py${{ matrix.python-version }})
    # Python 3.9 is unavailable on the newer ubuntu-latest image.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run the test suite
        run: pytest -v

  optical:
    name: optical quadrature validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optical test dependencies
        run: pip install -e '.[dev]' scipy pandas miepython
      - name: Test angular integrals and radius coverage
        run: pytest -v tests/test_optical_refinement.py
      - name: Validate installed optical source data
        run: |
          pip wheel --no-deps . -w /tmp/input-wheels
          pip install --no-deps --target /tmp/input-install /tmp/input-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/input-install python -c 'from pathlib import Path; import stardust_2d_inputs as p; from stardust_2d_inputs.generators.optical import silica, _common; assert str(Path(p.__file__)).startswith("/tmp/input-install/"); silica._refractive_index(_common.OpticalConfig())'
